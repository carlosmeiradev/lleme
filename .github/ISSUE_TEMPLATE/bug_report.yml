name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, provider credentials, prompts or completions.
        Security problems go through SECURITY.md, not an issue.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Deployment target
      options:
        - Native server
        - Cloudflare Workers build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant log lines, with secrets and content removed.
    validations:
      required: true
